<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>מסך לובי</title>
<style>
:root{--green:#0cad43;--border:#cfd5d8}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,"Noto Sans Hebrew",sans-serif;color:#111}
.app{
  width:100vw;height:100vh;background:#fff;
  display:grid;
  grid-template-columns:60% 40%;
  grid-template-rows:calc(100vh - 92px) 92px;
  direction:ltr
}
.visual{
  position:relative;overflow:hidden;background:#fff;
  border-right:1px solid var(--border)
}
.visual img{
  width:100%;height:100%;
  object-fit:cover;
  object-position:center;
  display:block;
  background:#fff
}
.panel{
  direction:rtl;padding:18px 22px 12px;
  display:grid;grid-template-rows:auto auto auto 1fr;
  gap:10px;background:#fff
}
.topbar{background:#242a31;color:#fff;text-align:center;font-size:28px;font-weight:700;padding:10px}
.clock{text-align:center}
.time{font-size:92px;line-height:1;color:#17c53f;font-weight:500;letter-spacing:2px}
.date{font-size:24px;margin-top:7px;color:#333}
.weather{
  border-top:1px solid #d7d7d7;border-bottom:1px solid #e5e5e5;
  padding:12px 0 13px;
  display:grid;grid-template-columns:1.05fr 1.2fr;gap:10px;align-items:center
}
.now{display:flex;justify-content:center;align-items:center;gap:12px}
.bigicon{font-size:60px}
.bigtemp{font-size:58px;line-height:1}
.desc{font-size:18px;color:#555;margin-top:6px}
.forecast{display:grid;grid-template-columns:repeat(3,1fr)}
.fday{text-align:center;border-right:1px solid #ddd;font-size:15px}
.fday:last-child{border-right:none}
.ficon{font-size:27px;margin:5px 0}
.fhi{font-size:20px}
.flo{font-size:14px;color:#777}
.notices{align-self:stretch;background:linear-gradient(#11ad41,#079437);color:#fff;overflow:hidden}
.ntitle{text-align:center;font-size:28px;font-weight:700;padding:10px;border-bottom:1px solid rgba(255,255,255,.28)}
.nbody{padding:12px 16px;font-size:20px;line-height:1.55;text-align:right}
.ticker{
  grid-column:1/3;
  display:grid;grid-template-columns:190px 1fr;
  background:#fff;border-top:1px solid #bbb;
  direction:ltr
}
.brand{
  display:flex;align-items:center;justify-content:center;
  gap:8px;font-weight:700;font-size:28px;border-right:1px solid #bbb
}
.ycircle{
  width:46px;height:46px;border-radius:50%;background:#d71920;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700
}
.newswrap{direction:rtl;overflow:hidden;white-space:nowrap;display:flex;align-items:center}
.news{
  display:inline-block;padding-left:100%;
  animation:scroll 30s linear infinite;
  font-size:22px;color:#333
}
@keyframes scroll{
  from{transform:translateX(0)}
  to{transform:translateX(100%)}
}
</style>
</head>
<body>
<div class="app">
  <div class="visual">
    <img id="mainImage" src="cleanliness.jpg" alt="תמונת לובי">
  </div>

  <div class="panel">
    <div class="topbar">ברוכים הבאים לבניין</div>

    <div class="clock">
      <div class="time" id="time">--:--</div>
      <div class="date" id="date">טוען תאריך...</div>
    </div>

    <div class="weather">
      <div class="now">
        <div class="bigicon" id="bigIcon">☀️</div>
        <div>
          <div class="bigtemp"><span id="temp">--</span>°</div>
          <div class="desc" id="weatherDesc">מזג האוויר בנתניה</div>
        </div>
      </div>
      <div class="forecast" id="forecast"></div>
    </div>

    <div class="notices">
      <div class="ntitle">הודעות לדיירים</div>
      <div class="nbody">
        • נא לשמור על ניקיון הלובי והשטחים המשותפים<br>
        • החניון והשטחים המשותפים מצולמים 24/7
      </div>
    </div>
  </div>

  <div class="ticker">
    <div class="brand"><span class="ycircle">y</span><span>net</span></div>
    <div class="newswrap">
      <div class="news">חדשות ועדכונים • ברוכים הבאים לבניין • נא לשמור על הסדר והניקיון בשטחים המשותפים</div>
    </div>
  </div>
</div>

<script>
const ROTATE_EVERY = 30 * 60 * 1000;
const images = ["cleanliness.jpg", "mishael-motors.png"];

function updateImageByTime(){
  const index = Math.floor(Date.now() / ROTATE_EVERY) % images.length;
  const img = document.getElementById("mainImage");
  const wanted = images[index];
  if (!img.src.endsWith(wanted)) img.src = wanted;
}
updateImageByTime();
setInterval(updateImageByTime, 30000);

function updateClock(){
  const now = new Date();
  document.getElementById("time").textContent =
    now.toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit",hour12:false});
  document.getElementById("date").textContent =
    now.toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}
updateClock();
setInterval(updateClock,1000);

function iconFor(code){
  if(code===0) return "☀️";
  if([1,2].includes(code)) return "🌤️";
  if(code===3) return "☁️";
  if([45,48].includes(code)) return "🌫️";
  if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return "🌧️";
  if([71,73,75,77,85,86].includes(code)) return "❄️";
  if([95,96,99].includes(code)) return "⛈️";
  return "🌤️";
}
function descFor(code){
  if(code===0) return "בהיר";
  if([1,2].includes(code)) return "מעונן חלקית";
  if(code===3) return "מעונן";
  if([45,48].includes(code)) return "ערפל";
  if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return "גשום";
  if([95,96,99].includes(code)) return "סופות רעמים";
  return "מזג האוויר בנתניה";
}
async function loadWeather(){
  try{
    const url="https://api.open-meteo.com/v1/forecast?latitude=32.3329&longitude=34.8599&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia%2FJerusalem&forecast_days=4";
    const r=await fetch(url,{cache:"no-store"});
    const d=await r.json();

    document.getElementById("temp").textContent=Math.round(d.current.temperature_2m);
    document.getElementById("bigIcon").textContent=iconFor(d.current.weather_code);
    document.getElementById("weatherDesc").textContent=descFor(d.current.weather_code)+" • נתניה";

    const names=["היום","מחר","מחרתיים"];
    let html="";
    for(let i=1;i<=3;i++){
      html+=`<div class="fday">
        <div>${names[i-1]}</div>
        <div class="ficon">${iconFor(d.daily.weather_code[i])}</div>
        <div class="fhi">${Math.round(d.daily.temperature_2m_max[i])}°</div>
        <div class="flo">${Math.round(d.daily.temperature_2m_min[i])}°</div>
      </div>`;
    }
    document.getElementById("forecast").innerHTML=html;
  }catch(e){
    document.getElementById("weatherDesc").textContent="מזג האוויר בנתניה";
  }
}
loadWeather();
setInterval(loadWeather,20*60*1000);
</script>
</body>
</html>
